# Mouse: select and scroll with the mouse, as in an ordinary terminal.
set -g mouse on

# OSC 52: a copy inside tmux reaches the clipboard of the computer you are
# connecting from, even over SSH or mosh. Without it a copy is stuck in the
# server's own clipboard, which nobody can paste from.
# The sequence names the "c" clipboard, because mosh forwards only that one,
# and still reads %p1: tmux 3.4 with ncurses 6.4 sends nothing when it is
# left out.
set -s set-clipboard on
set -as terminal-overrides ',xterm*:Ms=\E]52;c%p1%s;%p2%s\007'
set -as terminal-overrides ',screen*:Ms=\E]52;c%p1%s;%p2%s\007'
set -as terminal-overrides ',tmux*:Ms=\E]52;c%p1%s;%p2%s\007'

# The selection has the colour the Devmachine app gives its own, so a
# selection looks the same wherever it was made.
set -g mode-style 'bg=#00a6b2'

# copy-mode-vi: y copies the selection, and sends it out through OSC 52.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Dragging a selection with the mouse copies on release, through OSC 52 as
# well, and leaves copy mode so the next key reaches the shell.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
